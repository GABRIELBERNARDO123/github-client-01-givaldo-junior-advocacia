              "@type": "Question",
              "name": "Posso me divorciar mesmo se o meu cônjuge for contra e se recusar a assinar?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim, com absoluta certeza. No Brasil, o divórcio é um direito potestativo incondicionado (Emenda Constitucional 66/2010). Ninguém é obrigado a permanecer casado. Se o outro cônjuge se recusar a assinar ou criar dificuldades, o Dr. Givaldo Júnior ingressa com a Ação de Divórcio no Judiciário, e o juiz decreta a dissolução do casamento independentemente da concordância dele."
              }
            },
            {
              "@type": "Question",
              "name": "Quanto tempo demora um divórcio sob a sua condução?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Se for consensual (amigável) e sem filhos menores, é possível finalizar em cartório em questão de dias (frequentemente entre 3 a 15 dias). Caso haja filhos menores e exista consenso, realiza-se por via judicial com homologação célere pelo Ministério Público (cerca de 30 a 60 dias). Em casos litigiosos, obtêm-se as medidas urgentes (pensão provisória, guarda e afastamento) logo no início via liminar."
              }
            },
            {
              "@type": "Question",
              "name": "O atendimento comigo pode ser realizado totalmente online?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim, com total conforto e sigilo. O Dr. Givaldo Júnior atende presencialmente em seu escritório em Cascavel/PR ou em consultas jurídicas 100% online por videoconferência com sigilo assegurado para clientes em todo o Paraná, no Brasil e brasileiros no exterior."
              }
            },
            {
              "@type": "Question",
              "name": "Como funciona a divisão dos bens adquiridos durante o casamento?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A regra de divisão depende do regime de bens adotado no casamento. No regime padrão (Comunhão Parcial de Bens), todos os bens adquiridos onerosamente durante a união pertencem a ambos em partes iguais (50% para cada), independentemente de quem pagou ou em nome de quem está registrado."
              }
            },
            {
              "@type": "Question",
              "name": "Como defendo a guarda dos seus filhos perante o juiz?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A regra geral prevista pela legislação brasileira é a Guarda Compartilhada, na qual ambos os pais tomam decisões conjuntas sobre a criação, educação e saúde dos filhos. Estabelece-se uma base de residência principal e um cronograma saudável e equilibrado de convivência. Em situações de violência ou risco, atua-se para obter a guarda unilateral."
              }
            },
            {
              "@type": "Question",
              "name": "Qual o valor correto da pensão alimentícia? Existe porcentagem fixa de 30%?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Não existe na lei uma porcentagem fixa de 30%. O valor é determinado pelo binômio Necessidade de quem recebe versus Possibilidade de quem paga, com razoabilidade e proporcionalidade. Calculam-se minuciosamente as despesas reais dos filhos e demonstra-se a capacidade contributiva real da outra parte."
              }
            },
            {
              "@type": "Question",
              "name": "Se não éramos casados no papel, tenho os mesmos direitos da união estável?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim. A Constituição e o Código Civil equiparam a união estável ao casamento para efeitos de partilha e direitos. Se a convivência foi pública, contínua, duradoura e com o objetivo de constituir família, aplica-se a regra da comunhão parcial de bens através de Ação de Reconhecimento e Dissolução de União Estável."
              }
            }
