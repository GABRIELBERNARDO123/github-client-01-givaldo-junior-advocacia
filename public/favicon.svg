<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradiente Dourado Nobre e Cintilante -->
    <linearGradient id="goldGradient" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFF2DC" />
      <stop offset="20%" stop-color="#E7C785" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="65%" stop-color="#C5A880" />
      <stop offset="85%" stop-color="#A27D33" />
      <stop offset="100%" stop-color="#7B5B1E" />
    </linearGradient>

    <!-- Gradiente Dourado Suave para Detalhes Finos -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF0D0" />
      <stop offset="100%" stop-color="#C5A880" />
    </linearGradient>

    <!-- Filtro de Brilho Sutil de Ouro Polido -->
    <filter id="goldShine" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#goldShine)">
    <!-- ==================== EMBLEMA MONOGRAMA CENTRAL (GJ) ==================== -->
    <g transform="translate(250, 145)">
      
      <!-- Arabescos / Folhagens Laterais de Nobreza Clássica -->
      <!-- Lado Esquerdo -->
      <path d="M -75, -10 C -92, -35 -72, -65 -45, -75 C -55, -55 -48, -35 -38, -25 C -48, -15 -60, -5 -75, -10 Z" 
            fill="url(#goldGradient)" opacity="0.85" />
      <path d="M -85, 5 C -105, -15 -90, -45 -65, -50 C -70, -32 -60, -15 -52, -5 C -62, 5 -75, 12 -85, 5 Z" 
            fill="url(#goldGradient)" opacity="0.6" />
      <path d="M -60, 20 C -80, 25 -92, 5 -80, -15 C -72, -2 -65, 8 -50, 15 Z" 
            fill="url(#goldGradient)" opacity="0.75" />

      <!-- Lado Direito -->
      <path d="M 75, -10 C 92, -35 72, -65 45, -75 C 55, -55 48, -35 38, -25 C 48, -15 60, -5 75, -10 Z" 
            fill="url(#goldGradient)" opacity="0.85" />
      <path d="M 85, 5 C 105, -15 90, -45 65, -50 C 70, -32 60, -15 52, -5 C 62, 5 75, 12 85, 5 Z" 
            fill="url(#goldGradient)" opacity="0.6" />
      <path d="M 60, 20 C 80, 25 92, 5 80, -15 C 72, -2 65, 8 50, 15 Z" 
            fill="url(#goldGradient)" opacity="0.75" />

      <!-- Detalhe do Topo Central (Losango Imperial) -->
      <path d="M 0, -88 L 6, -80 L 0, -72 L -6, -80 Z" fill="url(#goldLight)" />
      <circle cx="0" cy="-94" r="2.5" fill="url(#goldLight)" />
      <circle cx="-16" cy="-84" r="1.8" fill="url(#goldLight)" opacity="0.8" />
      <circle cx="16" cy="-84" r="1.8" fill="url(#goldLight)" opacity="0.8" />

      <!-- Letra G Caligráfica Romana -->
      <path d="M -6, -55 C -35, -55 -58, -32 -58, 2 C -58, 36 -32, 58 4, 58 C 30, 58 48, 44 54, 26 L 40, 24 C 36, 36 22, 45 4, 45 C -22, 45 -42, 27 -42, 2 C -42, -23 -24, -42 -4, -42 C 14, -42 26, -34 32, -22 L 44, -28 C 36, -44 18, -55 -6, -55 Z" 
            fill="url(#goldGradient)" />
      <!-- Barra Horizontal e Espigão do G -->
      <path d="M 12, 6 L 46, 6 L 46, -4 L 12, -4 Z" fill="url(#goldGradient)" />
      <path d="M 40, -10 L 46, -10 L 46, 24 L 40, 24 Z" fill="url(#goldGradient)" />

      <!-- Letra J Interligada e Cursiva -->
      <!-- Haste vertical e laço superior -->
      <path d="M -2, -62 C 6, -72 24, -72 32, -60 C 38, -50 32, -38 22, -34 C 18, -32 14, -30 12, -26 L 12, 18 C 12, 42 -4, 56 -24, 56 C -40, 56 -48, 44 -48, 32 C -48, 22 -38, 16 -30, 16 C -20, 16 -14, 22 -14, 30 C -14, 38 -20, 42 -26, 42 C -24, 45 -18, 46 -12, 46 C 0, 46 4, 36 4, 18 L 4, -46 C 4, -54 10, -60 18, -60 C 24, -60 26, -54 22, -48 C 18, -44 14, -42 8, -42 L 8, -48 C 12, -48 14, -50 16, -54 C 14, -56 12, -56 8, -54 Z" 
            fill="url(#goldGradient)" />

      <!-- Ponto de Luz / Remate da Base -->
      <circle cx="-30" cy="24" r="3" fill="url(#goldLight)" />
      <path d="M 0, 68 L 4, 73 L 0, 78 L -4, 73 Z" fill="url(#goldLight)" opacity="0.8" />
    </g>

    <!-- ==================== TIPOGRAFIA DA MARCA ==================== -->
    <!-- Nome Principal: GIVALDO JUNIOR -->
    <text x="250" y="295" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
          font-size="44" 
          font-weight="700" 
          letter-spacing="4" 
          fill="url(#goldGradient)">
      GIVALDO JUNIOR
    </text>

    <!-- Linha Divisória Fina Dourada com Losango Central -->
    <line x1="120" y1="318" x2="232" y2="318" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.6" />
    <polygon points="250,314 254,318 250,322 246,318" fill="url(#goldLight)" />
    <line x1="268" y1="318" x2="380" y2="318" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.6" />

    <!-- Subtítulo: ADVOGADO OAB/PR 100.231 -->
    <text x="250" y="348" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" 
          font-size="19" 
          font-weight="700" 
          letter-spacing="5" 
          fill="url(#goldGradient)">
      ADVOGADO  OAB/PR 100.231
    </text>

    <!-- Especialidades: DIREITO DE FAMÍLIA • RECUPERAÇÃO DE CRÉDITO • REGULARIZAÇÃO DE IMÓVEIS -->
    <text x="250" y="388" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" 
          font-size="11.5" 
          font-weight="600" 
          letter-spacing="1.8" 
          fill="url(#goldGradient)"
          opacity="0.95">
      DIREITO DE FAMÍLIA • RECUPERAÇÃO DE CRÉDITO •
    </text>
    <text x="250" y="408" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" 
          font-size="11.5" 
          font-weight="600" 
          letter-spacing="1.8" 
          fill="url(#goldGradient)"
          opacity="0.95">
      REGULARIZAÇÃO DE IMÓVEIS
    </text>
  </g>
</svg>
